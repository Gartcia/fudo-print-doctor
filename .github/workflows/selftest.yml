name: self-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: Self-test en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # El script corre en las PCs de los clientes con el PowerShell que trae Windows.
      - name: Windows PowerShell 5.1
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\FudoPrintDoctor.ps1 -SelfTest
          echo Exit code: %errorlevel%
          if %errorlevel% neq 0 exit /b %errorlevel%

      - name: PowerShell 7
        shell: pwsh
        run: |
          ./FudoPrintDoctor.ps1 -SelfTest
          # OJO: con 'return' en el script, $LASTEXITCODE queda $null. Comparar contra 0
          # directamente marca el job en rojo aunque el self-test haya pasado.
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sintaxis (parser)
        shell: pwsh
        run: |
          $errs = $null; $toks = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./FudoPrintDoctor.ps1), [ref]$toks, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "L$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          "Parser OK ($($toks.Count) tokens)"

      - name: VERSION coincide con el script
        shell: pwsh
        run: |
          $ver = (Get-Content ./VERSION -Raw).Trim()
          $m = Select-String -Path ./FudoPrintDoctor.ps1 -Pattern "SchemaVersion\s*=\s*'([\d.]+)'" | Select-Object -First 1
          $enScript = $m.Matches[0].Groups[1].Value
          "VERSION=$ver  script=$enScript"
          if ($ver -ne $enScript) { "No coinciden: actualizar el archivo VERSION"; exit 1 }

  analyzer:
    name: PSScriptAnalyzer (informativo)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path ./FudoPrintDoctor.ps1 -Severity Error,Warning `
                 -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingEmptyCatchBlock,PSUseSingularNouns,PSAvoidUsingInvokeExpression
          if ($r) { $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host } else { "Sin observaciones" }
          $errores = @($r | Where-Object { "$($_.Severity)" -eq 'Error' })
          if (@($errores).Count -gt 0) { "Hay $(@($errores).Count) error(es) de analisis"; exit 1 }
